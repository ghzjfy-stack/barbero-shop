<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>הורדת ריל MinoxShop</title>
  <style>
    :root { --cream:#FBF6EE; --navy:#142444; --gold:#C49A4A; }
    body { margin:0; font-family: Heebo, Arial, sans-serif; background:linear-gradient(180deg,#FBF6EE,#F3E8D7); color:var(--navy); min-height:100vh; display:grid; place-items:center; padding:24px; }
    .card { width:min(520px,100%); background:#fff; border-radius:20px; padding:28px; box-shadow:0 10px 40px rgba(20,36,68,.08); }
    h1 { margin:0 0 8px; font-size:1.4rem; }
    p { margin:0 0 18px; line-height:1.5; opacity:.85; }
    video { width:100%; border-radius:14px; background:#111; margin:0 0 18px; }
    a.btn { display:block; text-align:center; text-decoration:none; background:var(--navy); color:#fff; padding:14px 18px; border-radius:12px; font-weight:700; }
    a.btn:hover { filter:brightness(1.08); }
    .alt { margin-top:12px; text-align:center; font-size:.92rem; }
    .alt a { color:var(--navy); }
  </style>
</head>
<body>
  <div class="card">
    <h1>ריל MinoxShop — 30 שניות</h1>
    <p>אם אין כפתור הורדה בצ׳אט, הורד מכאן ישירות למכשיר.</p>
    <video src="./minoxshop_reel_30s.mp4" controls playsinline></video>
    <a class="btn" href="./minoxshop_reel_30s.mp4" download="minoxshop_reel_30s.mp4">הורדת הסרטון</a>
    <div class="alt"><a href="./minoxshop_reel_30s.mp4" target="_blank" rel="noopener">פתיחה בחלון חדש</a></div>
  </div>
</body>
</html>
