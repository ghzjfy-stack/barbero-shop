<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1834" />
    <meta
      name="description"
      content="רוגיין מקורי מארה״ב — קצף לגברים, משלוח חינם עד הבית ונקודות בונוס. צפו בריל והמשיכו לחנות MinoxShop."
    />
    <link rel="canonical" href="https://www.minox-shop.co.il/" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="he_IL" />
    <meta property="og:site_name" content="MinoxShop" />
    <meta property="og:title" content="MinoxShop | ריל מוצרים" />
    <meta
      property="og:description"
      content="רוגיין מקורי מארה״ב — קצף לגברים, משלוח חינם עד הבית ונקודות בונוס."
    />
    <meta property="og:url" content="https://www.minox-shop.co.il/" />
    <meta property="og:image" content="./frames/cover.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MinoxShop | ריל מוצרים" />
    <title>MinoxShop | ריל מוצרים</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="reel-page">
      <div class="reel-shell">
        <header class="reel-topbar">
          <div class="reel-brand-row">
            <img class="reel-logo" src="./frames/logo.jpg" alt="" width="36" height="36" />
            <p class="reel-brand">MinoxShop</p>
          </div>
          <a class="reel-top-link" href="https://www.minox-shop.co.il" target="_blank" rel="noopener noreferrer">לאתר</a>
        </header>

        <div class="reel-stage" id="stage" role="region" aria-label="ריל מוצרים של MinoxShop">
          <div class="reel-progress" id="progress" aria-hidden="true"></div>
          <img class="reel-frame" id="frame" alt="" draggable="false" />
          <div class="reel-scrim" aria-hidden="true"></div>
          <div class="reel-copy" id="copy"></div>
          <button type="button" class="reel-pause" id="pause" aria-label="השהה">❚❚</button>
        </div>

        <nav class="reel-dots" id="dots" aria-label="בחירת פריים"></nav>
        <p class="reel-hint">החליקו או לחצו למעבר בין הפריימים</p>
      </div>
    </div>
    <script src="./app.js" defer></script>
  </body>
</html>
