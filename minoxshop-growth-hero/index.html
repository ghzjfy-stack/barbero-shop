<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MinoxShop | גררו לפי החודשים</title>
    <meta
      name="description"
      content="סליידר תוצאות אמיתי — גררו לפי חודשי טיפול ורואים איך השיער מתמלא. מקורי מארה״ב, משלוח חינם עד הבית."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&family=Assistant:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="hero" id="top">
      <div class="hero-atmosphere" aria-hidden="true"></div>

      <header class="hero-brand">
        <img class="brand-mark" src="./assets/main-logo.png" alt="MinoxShop" width="72" height="66" />
        <p class="brand-name">MinoxShop</p>
      </header>

      <div class="hero-copy">
        <h1>גררו לפי החודשים — השיער מתמלא</h1>
        <p class="lede">
          תוצאה אמיתית מהשטח · לפי קצב שמתאים להוראות היצרן · לא פילטר ולא AI
        </p>
      </div>

      <section
        class="scrubber"
        id="scrubber"
        aria-label="השוואת לפני ואחרי לפי חודשי טיפול"
      >
        <div class="stage" id="stage">
          <img class="layer before" src="./assets/ba-before.jpg" alt="לפני תחילת הטיפול — דילול בקדקוד" draggable="false" />
          <div class="after-clip" id="afterClip">
            <img class="layer after" src="./assets/ba-after.jpg" alt="אחרי ארבעה חודשים — צפיפות מוגברת" draggable="false" />
          </div>
          <div class="soft-edge" id="softEdge" aria-hidden="true"></div>
          <div class="handle" id="handle" role="presentation">
            <span class="handle-line"></span>
            <span class="handle-knob" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2">
                <path d="M14 6l-6 6 6 6" />
                <path d="M10 6l6 6-6 6" />
              </svg>
            </span>
          </div>
          <div class="corner-labels" aria-hidden="true">
            <span class="tag after-tag">אחרי</span>
            <span class="tag before-tag">לפני</span>
          </div>
        </div>

        <label class="sr-only" for="monthRange">חודשי טיפול</label>
        <input
          id="monthRange"
          class="range"
          type="range"
          min="0"
          max="6"
          step="0.01"
          value="0.4"
          aria-valuemin="0"
          aria-valuemax="6"
          aria-valuenow="0"
          aria-valuetext="חודש 0"
        />

        <div class="months" role="list" aria-hidden="true">
          <button type="button" data-m="0" class="month is-active">0</button>
          <button type="button" data-m="2" class="month">2</button>
          <button type="button" data-m="4" class="month">4</button>
          <button type="button" data-m="6" class="month">6</button>
        </div>
        <p class="month-caption">
          <span id="monthWord">חודש 0</span>
          <span class="dot">·</span>
          <span id="monthHint">תחילת הדרך</span>
        </p>
      </section>

      <div class="hero-cta">
        <a class="btn-primary" href="https://www.minox-shop.co.il/#pricing">להזמנת מארז כפול</a>
        <p class="subcta">משלוח חינם עד הבית · מקורי מארה״ב</p>
        <p class="disclaimer">תוצאות משתנות בין אנשים. יש להתייעץ עם רופא לפני השימוש.</p>
      </div>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
